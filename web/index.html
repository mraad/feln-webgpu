<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Sea FELN</title>
<link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
<script type="module" src="https://js.arcgis.com/5.1/"></script>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ddd; --accent: #0b5cad; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; --accent: #6db3f2; } }
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  #status { color: var(--muted); min-height: 1.4em; }
  form { display: flex; gap: 8px; margin: 12px 0; }
  input { flex: 1; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; }
  pre { background: color-mix(in srgb, var(--fg) 6%, var(--bg)); padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; margin: 6px 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; white-space: nowrap; }
  .wrap { overflow-x: auto; }
  h2 { font-size: 1rem; margin: 10px 0 2px; color: var(--muted); }
  #progress { display: grid; grid-template-columns: max-content 1fr max-content; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--muted); margin: 6px 0; }
  #progress:empty { display: none; }
  #progress progress { width: 100%; height: 8px; }
  arcgis-map { display: block; height: 420px; border: 1px solid var(--line); border-radius: 6px; margin: 6px 0 12px; }
</style>
</head>
<body>
<h1>North Sea: ask in English, run in DuckDB. All in this tab.</h1>
<div id="status">Loading...</div>
<div id="progress"></div>
<form id="form">
  <input id="q" placeholder="e.g. Show gas pipelines within 5 kilometers of dry wells" autocomplete="off" disabled>
  <button id="go" disabled>Ask</button>
</form>
<arcgis-map id="map" basemap="dark-gray-vector" center="3, 60" zoom="5"><arcgis-zoom slot="top-left"></arcgis-zoom></arcgis-map>
<h2>FELN</h2><pre id="feln"></pre>
<h2>SQL</h2><pre id="sql"></pre>
<h2 id="rows-h">Rows</h2><div class="wrap"><table id="rows"></table></div>
<script type="module" src="./app.js"></script>
</body>
</html>
